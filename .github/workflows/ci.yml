name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test (frontmatter, sections, links, snippets, CSP lint, manifests, examples)
        run: go test ./...
      - name: build the Ayra examples for js/wasm
        run: GOOS=js GOARCH=wasm go build ./examples/ayra/...
      - name: vet the Ayra examples for js/wasm
        run: GOOS=js GOARCH=wasm go vet ./examples/ayra/...
